name: Tests

on:
  push:
    branches:
      - main
      - feature/portrait-weather-grid
      - feature/us-027-lightbox-portrait
      - feature/us-028-seewetter-portrait-cards
      - feature/us-029-upperair-portrait-cards
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite
        run: bash scripts/run-tests.sh
